<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AccessibleWay 0.7.0 Sensor Collector</title><style>body{font:17px Arial,sans-serif;background:#071b30;color:white;padding:18px;max-width:620px;margin:auto}button{padding:14px;margin:6px 4px;background:#2788d1;color:white;border:1px solid white;border-radius:8px;font-size:16px}button:disabled{opacity:.45}pre{white-space:pre-wrap;background:#163553;padding:12px;border-radius:9px}small{color:#c3d6e6}</style></head><body><h2>AccessibleWay · Sensor Collector</h2><p>Experimental, local-network only. No GPS or personal identity collected.</p><p id="status">Ready</p><button id="start">Start collection</button><button id="stop" disabled>Stop</button><button id="mark">Mark heading / position</button><pre id="metrics">Awaiting sensors</pre><small>Keep the screen on. For Android 5.1, use Chrome if available. Accelerometer and orientation support vary by browser. This does not measure absolute indoor location.</small><script>
(function(){var active=false, samples=0, heading=null, acc=null, rotation=null, lastSend=0, sent=0, errors=0;var status=document.getElementById('status'),metrics=document.getElementById('metrics');function send(kind,note){var xhr=new XMLHttpRequest();xhr.open('POST','/api/observations',true);xhr.setRequestHeader('Content-Type','application/json');xhr.onload=function(){if(xhr.status===200)sent++;else errors++};xhr.onerror=function(){errors++};xhr.send(JSON.stringify({kind:kind,t:Date.now(),acc:acc,heading:heading,rotation:rotation,note:note||''}))}function motion(e){if(!active)return;var a=e.accelerationIncludingGravity||e.acceleration;if(a&&a.x!==null){acc={x:+a.x||0,y:+a.y||0,z:+a.z||0};samples++}var r=e.rotationRate;if(r)rotation={alpha:r.alpha||0,beta:r.beta||0,gamma:r.gamma||0};tick()}function orient(e){if(!active)return;if(e.alpha!==null&&e.alpha!==undefined)heading=+e.alpha;tick()}function tick(){var now=Date.now();if(now-lastSend>=200&&active){lastSend=now;send('sensor');metrics.textContent='Motion samples: '+samples+'\nHeading (raw): '+(heading===null?'unavailable':heading.toFixed(1)+'°')+'\nAcceleration: '+JSON.stringify(acc)+'\nSent: '+sent+' Errors: '+errors}}document.getElementById('start').onclick=function(){active=true;samples=0;window.addEventListener('devicemotion',motion);window.addEventListener('deviceorientation',orient);this.disabled=true;document.getElementById('stop').disabled=false;status.textContent='Collecting. Walk carefully in a clear, safe area.';send('calibration','start')};document.getElementById('stop').onclick=function(){active=false;window.removeEventListener('devicemotion',motion);window.removeEventListener('deviceorientation',orient);this.disabled=true;document.getElementById('start').disabled=false;status.textContent='Stopped';send('marker','stop')};document.getElementById('mark').onclick=function(){send('calibration','user mark')};})();
</script></body></html>
